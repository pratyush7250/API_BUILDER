<nz-drawer [nzBodyStyle]="{ overflow: 'auto' }" [nzMaskClosable]="true" [nzWidth]="getDrawerWidth()"
    [nzVisible]="visible" [nzTitle]="selectedNode?.name || 'Configuration'" [nzFooter]="footerTpl"
    (nzOnClose)="close()">
    <div class="content" *nzDrawerContent>
        <!-- <h3>Settings for: {{ selectedNode?.name }}</h3>
        <p>Node ID: {{ selectedNode?.id }}</p>
        <p>Type: {{ selectedNode?.type }}</p> -->

        <app-controller *ngIf="selectedNode?.type === 'CONTROLLER'"></app-controller>
        <app-doc *ngIf="selectedNode?.type === 'DOC'"></app-doc>
        <app-http-in *ngIf="selectedNode?.type === 'HTTP-IN'"></app-http-in>
    </div>
    <ng-template #footerTpl>
        <div style="float: right">
            <button nz-button style="margin-right: 8px;" (click)="close()">Cancel</button>
            <button nz-button nzType="primary" (click)="close()">Submit</button>
        </div>
    </ng-template>
</nz-drawer>
